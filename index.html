<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tabby</title>

  <!-- iOS PWA：iOS 不读 manifest 的 icons，必须给 apple-touch-icon（不透明底 180px） -->
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tabby" />
  <meta name="theme-color" content="#fadce9" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="app-title">TABBY</div>
      <div id="today-line" class="today-line"></div>
    </div>
    <div class="topbar-right">
      <span id="topbar-mode" class="mode-chip">正常</span>
      <button id="theme-toggle" class="theme-toggle" aria-label="切换主题">☀️</button>
    </div>
  </header>

  <div id="install-hint" class="banner hidden">
    用 Safari 打开 → 分享 → 添加到主屏幕，就能像 app 一样全屏使用喵
  </div>
  <div id="offline-banner" class="banner hidden">
    呜…连不上数据库喵，当前为只读模式（清单仍可查看，勾选不会保存）
  </div>

  <main>
    <!-- 双周日历：上周 + 这周。经期/PMS = 荧光笔涂抹，出血/果冻 = 下划线 -->
    <section class="card cal-card">
      <div id="biweek" class="biweek"></div>
      <div class="cal-legend">
        <span class="lg"><i class="lg-hl period"></i>经期</span>
        <span class="lg"><i class="lg-hl pms"></i>PMS</span>
        <span class="lg"><i class="lg-ul bleed"></i>出血</span>
        <span class="lg"><i class="lg-ul jelly"></i>果冻</span>
      </div>
    </section>

    <!-- 打卡 + 统计 -->
    <section class="card checkin-card">
      <div class="done-wrap">
        <button id="done-btn" class="done-btn">
          <svg class="done-ring" viewBox="0 0 112 112">
            <defs>
              <linearGradient id="doneGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#e88aa0" />
                <stop offset="100%" stop-color="#7eb3e8" />
              </linearGradient>
            </defs>
            <circle class="done-track" cx="56" cy="56" r="50" />
            <circle id="done-arc" class="done-arc" cx="56" cy="56" r="50" stroke="url(#doneGrad)" />
          </svg>
          <img id="done-stamp" class="done-stamp" src="./icons/icon-192.png" alt="" />
          <span id="done-label" class="done-label">长按打卡</span>
          <span id="done-say" class="done-say" hidden>太棒了喵！ฅ^•ﻌ•^ฅ</span>
        </button>
        <div class="done-sub" id="done-sub">今天正常完成</div>
      </div>
      <!-- 三个统计位都可点按切换显示内容 -->
      <div class="stats">
        <button class="stat" id="stat-recent-btn">
          <span class="stat-icon" data-tint="orange">❀</span>
          <span id="stat-recent-label" class="stat-label">经期结束后</span>
          <span id="stat-recent" class="stat-value">—</span>
        </button>
        <button class="stat" id="stat-predict-btn">
          <span class="stat-icon" data-tint="purple">☾</span>
          <span class="stat-label">预测经期</span>
          <span id="stat-predict" class="stat-value">—</span>
        </button>
        <button class="stat" id="stat-symptoms-btn">
          <span class="stat-icon" data-tint="pink">♥</span>
          <span class="stat-label">今日症状</span>
          <span id="stat-symptoms" class="stat-value">0 项</span>
        </button>
      </div>
    </section>

    <h2 class="section-heading">今日安排</h2>
    <div id="checklist" class="timeline"></div>

    <!-- 今日症状（默认收起） -->
    <section class="card symptoms-card">
      <button id="symptoms-toggle" class="symptoms-head">
        <span class="symptoms-title">今日症状</span>
        <span id="symptoms-count" class="sym-count"></span>
        <span id="symptoms-chev" class="chev">▾</span>
      </button>
      <div id="symptoms-body" class="symptoms-body" hidden>
        <div id="symptom-chips" class="chips"></div>
        <div id="severity-picker"></div>
        <div class="custom-symptom">
          <input id="custom-symptom-input" type="text" placeholder="其他症状…" enterkeyhint="done" />
          <button id="custom-symptom-add">记录</button>
        </div>
      </div>
    </section>

    <!-- 分割线：以下是与 Tabby 的聊天记录；小猫坐在线的左上角 -->
    <div class="chat-divider">
      <span class="cat-wrap">
        <span id="chat-cat" class="chat-cat">(=˘ω˘=) zzZ</span>
        <span id="chat-listen" class="chat-listen" hidden>Tabby is listening…</span>
      </span>
    </div>

    <section id="chat-log" class="chat-log"></section>
  </main>

  <div class="chat-bar">
    <div class="inner">
      <input id="chat-input" type="text" placeholder="跟 Tabby 说点什么喵…" enterkeyhint="send" />
      <button id="chat-send" aria-label="发送">↑</button>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
