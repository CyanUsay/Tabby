<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tabby</title>

  <!-- iOS PWA：iOS 不读 manifest 的 icons，必须给 apple-touch-icon（不透明底 180px） -->
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tabby" />
  <meta name="theme-color" content="#fadce9" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="install-hint" class="banner hidden">
    用 Safari 打开 → 分享 → 添加到主屏幕，就能像 app 一样全屏使用
  </div>
  <div id="offline-banner" class="banner hidden">
    连不上数据库，当前为只读模式（清单仍可查看，勾选不会保存）
  </div>

  <main>
    <section class="hero">
      <div class="hero-row">
        <div>
          <div id="greeting" class="greeting">你好</div>
          <div id="date-line" class="date-line"></div>
        </div>
        <button id="theme-toggle" class="theme-toggle" aria-label="切换主题">☀️</button>
      </div>
    </section>

    <h2 class="section-heading">今日进度</h2>
    <section class="card progress-card">
      <div class="ring-wrap">
        <svg viewBox="0 0 120 120" class="ring">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#e88aa0" />
              <stop offset="100%" stop-color="#7eb3e8" />
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="60" cy="60" r="52" />
          <circle id="ring-fill" class="ring-fill" cx="60" cy="60" r="52" stroke="url(#ringGrad)" />
        </svg>
        <div class="ring-center">
          <div id="ring-pct" class="ring-pct">0%</div>
          <div id="ring-sub" class="ring-sub">0/0 已完成</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-icon" data-tint="blue">✦</span>
          <span class="stat-label">状态</span>
          <span id="stat-mode" class="stat-value">日常</span>
        </div>
        <div class="stat">
          <span class="stat-icon" data-tint="purple">☾</span>
          <span class="stat-label">下次经期</span>
          <span id="stat-next" class="stat-value">—</span>
        </div>
        <div class="stat">
          <span class="stat-icon" data-tint="pink">♥</span>
          <span class="stat-label">今日症状</span>
          <span id="stat-symptoms" class="stat-value">0 项</span>
        </div>
        <div class="stat">
          <span class="stat-icon" data-tint="orange">✚</span>
          <span class="stat-label">今日补剂</span>
          <span id="stat-count" class="stat-value">0 种</span>
        </div>
      </div>
    </section>

    <h2 class="section-heading">今日安排</h2>
    <div id="checklist" class="timeline"></div>

    <h2 class="section-heading">今日症状</h2>
    <section class="card">
      <div id="symptom-chips" class="chips"></div>
      <div id="severity-picker"></div>
      <div class="custom-symptom">
        <input id="custom-symptom-input" type="text" placeholder="其他症状…" enterkeyhint="done" />
        <button id="custom-symptom-add">记录</button>
      </div>
    </section>

    <section id="chat-log" class="chat-log"></section>
  </main>

  <div class="chat-bar">
    <div class="inner">
      <input id="chat-input" type="text" placeholder="跟 Tabby 说一句… 比如“今天都吃了”" enterkeyhint="send" />
      <button id="chat-send" aria-label="发送">↑</button>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
